name: flutter_face_sdk
description: Local Flutter FFI wrapper for Luxand FaceSDK Android 8.3.
version: 8.3.0

environment:
  sdk: '>=2.19.5 <4.0.0'
  flutter: ">=2.11.0"

dependencies:
  camera: ^0.10.5+5
  ffi: ^2.0.1
  flutter:
    sdk: flutter
  get: ^4.6.5
  http: '>=0.13.1 <2.0.0'
  path: ^1.8.0
  path_provider: ^2.0.1
  plugin_platform_interface: ^2.0.2
  sqflite: ^2.2.8+4
  equatable: ^2.0.5
  screen_brightness: '>=1.0.1 <3.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_bloc: ^8.1.6

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
